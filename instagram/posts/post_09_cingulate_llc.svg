  <rect x="88" y="542" width="12" height="12" rx="3" fill="#60a5fa" /><text x="118" y="560" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="500">Custom AI/ML architecture for biotech, pharma &amp;</text><text x="118" y="594" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="500">defense clinical trials</text><rect x="88" y="626" width="12" height="12" rx="3" fill="#60a5fa" /><text x="118" y="644" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="500">End-to-end multi-modal MRI/PET/CT biomarker</text><text x="118" y="678" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="500">pipelines (ANTsPyMM)</text><rect x="88" y="710" width="12" height="12" rx="3" fill="#60a5fa" /><text x="118" y="728" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="500">Concurrent 3D super-resolution &amp; longitudinal</text><text x="118" y="762" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="500">disease staging (subtyper)</text><rect x="88" y="794" width="12" height="12" rx="3" fill="#60a5fa" /><text x="118" y="812" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="500">Direct principal advisory by Brian B. Avants, Ph.D.</text>

