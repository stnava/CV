  <rect x="88" y="542" width="12" height="12" rx="3" fill="#818cf8" /><text x="118" y="560" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="500">SyN: Symmetric geodesic diffeomorphic registration</text><text x="118" y="594" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="500">with cross-correlation</text><rect x="88" y="626" width="12" height="12" rx="3" fill="#818cf8" /><text x="118" y="644" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="500">N4ITK: Improved B-spline bias field correction for</text><text x="118" y="678" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="500">MRI intensity uniformity</text><rect x="88" y="710" width="12" height="12" rx="3" fill="#818cf8" /><text x="118" y="728" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="500">Strictly respects physical space orientation,</text><text x="118" y="762" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="500">spacing &amp; direction cosines</text><rect x="88" y="794" width="12" height="12" rx="3" fill="#818cf8" /><text x="118" y="812" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="500">2026 evolution: Deep Computational Anatomy via</text><text x="118" y="846" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="500">Multiview Normalizing Flows</text>

